<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Void: Cyberpunk Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.7), 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .neon-text-danger {
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.7), 0 0 20px rgba(239, 68, 68, 0.5);
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 21;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.2rem;
            pointer-events: none;
            text-align: left;
        }

        .health-bar-container {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 5px;
            transform: skewX(-20deg);
        }

        .health-fill {
            height: 100%;
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            width: 100%;
            transition: width 0.2s ease-out;
        }

        .btn-cyber {
            background: transparent;
            border: 2px solid #06b6d4;
            color: #06b6d4;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-cyber:hover {
            background: #06b6d4;
            color: #000;
            box-shadow: 0 0 20px #06b6d4;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Visual Effects Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (Heads Up Display) -->
    <div id="hud" class="hud hidden">
        <div class="text-cyan-400">SCORE: <span id="scoreDisplay">0</span></div>
        <div class="text-xs text-gray-400 mt-1">WAVE: <span id="waveDisplay">1</span></div>
        <div class="health-bar-container">
            <div id="healthFill" class="health-fill"></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="ui-layer interactive bg-black/80 backdrop-blur-sm">
        <h1 class="text-6xl md:text-8xl font-black text-white mb-2 neon-text tracking-tighter italic">NEON VOID</h1>
        <p class="text-cyan-200 mb-8 text-lg tracking-widest opacity-80">SURVIVE THE DIGITAL ONSLAUGHT</p>
        
        <div class="flex gap-8 mb-12 text-sm text-gray-300">
            <div class="flex flex-col items-center">
                <div class="border border-gray-600 px-3 py-1 rounded mb-2">WASD / ARROWS</div>
                <span>MOVE</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="border border-gray-600 px-3 py-1 rounded mb-2">MOUSE</div>
                <span>AIM & SHOOT</span>
            </div>
        </div>

        <button id="startBtn" class="btn-cyber">INITIALIZE SYSTEM</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="ui-layer interactive bg-red-900/20 backdrop-blur-md hidden">
        <h2 class="text-6xl font-black text-white mb-2 neon-text-danger">SYSTEM FAILURE</h2>
        <p class="text-red-200 mb-6 text-xl">FINAL SCORE: <span id="finalScore" class="font-bold text-white">0</span></p>
        <button id="restartBtn" class="btn-cyber border-red-500 text-red-500 hover:bg-red-500 hover:shadow-red-500">REBOOT</button>
    </div>

    <script>
        /**
         * NEON VOID - GAME ENGINE
         * A high-performance HTML5 Canvas shooter.
         */

        // --- Configuration & Constants ---
        const CONFIG = {
            playerSpeed: 5,
            playerDrag: 0.92,
            bulletSpeed: 15,
            fireRate: 8, // Frames between shots
            enemyBaseSpeed: 2,
            particleLife: 30,
            colors: {
                player: '#06b6d4', // Cyan
                bullet: '#facc15', // Yellow
                enemyBasic: '#a855f7', // Purple
                enemyFast: '#ec4899', // Pink
                enemyTank: '#ef4444', // Red
                bg: '#050505'
            }
        };

        // --- State Management ---
        const state = {
            isPlaying: false,
            score: 0,
            wave: 1,
            frames: 0,
            mouseX: 0,
            mouseY: 0,
            width: window.innerWidth,
            height: window.innerHeight
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const healthFill = document.getElementById('healthFill');
        const finalScoreDisplay = document.getElementById('finalScore');

        // --- Input Handling ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        window.addEventListener('mousemove', (e) => {
            state.mouseX = e.clientX;
            state.mouseY = e.clientY;
        });
        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            state.width = canvas.width;
            state.height = canvas.height;
        }
        resizeCanvas();

        // --- Classes ---

        class Vector {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vector(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vector(this.x - v.x, this.y - v.y); }
            mult(n) { return new Vector(this.x * n, this.y * n); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() {
                const m = this.mag();
                return m === 0 ? new Vector(0, 0) : new Vector(this.x / m, this.y / m);
            }
        }

        class Particle {
            constructor(x, y, color, speed, size) {
                this.pos = new Vector(x, y);
                const angle = Math.random() * Math.PI * 2;
                const velocityMag = Math.random() * speed;
                this.vel = new Vector(Math.cos(angle) * velocityMag, Math.sin(angle) * velocityMag);
                this.color = color;
                this.size = Math.random() * size + 1;
                this.life = CONFIG.particleLife;
                this.decay = Math.random() * 0.05 + 0.02;
            }

            update() {
                this.pos = this.pos.add(this.vel);
                this.life -= 1;
                this.size *= 0.95;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life / CONFIG.particleLife;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, targetX, targetY) {
                this.pos = new Vector(x, y);
                const dir = new Vector(targetX - x, targetY - y).normalize();
                this.vel = dir.mult(CONFIG.bulletSpeed);
                this.radius = 3;
                this.markedForDeletion = false;
                
                // Trail effect
                this.trail = [];
            }

            update() {
                // Add current pos to trail
                this.trail.push({x: this.pos.x, y: this.pos.y});
                if (this.trail.length > 5) this.trail.shift();

                this.pos = this.pos.add(this.vel);

                // Boundary check
                if (this.pos.x < 0 || this.pos.x > state.width || 
                    this.pos.y < 0 || this.pos.y > state.height) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                // Draw Trail
                ctx.beginPath();
                ctx.strokeStyle = CONFIG.colors.bullet;
                ctx.lineWidth = 2;
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    if (i === 0) ctx.moveTo(point.x, point.y);
                    else ctx.lineTo(point.x, point.y);
                }
                ctx.stroke();

                // Draw Bullet
                ctx.shadowBlur = 10;
                ctx.shadowColor = CONFIG.colors.bullet;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Enemy {
            constructor(type) {
                // Spawn logic: random edge
                const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
                if (edge === 0) { this.pos = new Vector(Math.random() * state.width, -30); }
                else if (edge === 1) { this.pos = new Vector(state.width + 30, Math.random() * state.height); }
                else if (edge === 2) { this.pos = new Vector(Math.random() * state.width, state.height + 30); }
                else { this.pos = new Vector(-30, Math.random() * state.height); }

                this.type = type;
                this.markedForDeletion = false;
                this.angle = 0;

                // Stats based on type
                if (type === 'basic') {
                    this.hp = 2;
                    this.speed = CONFIG.enemyBaseSpeed + (Math.random() * 0.5);
                    this.radius = 15;
                    this.color = CONFIG.colors.enemyBasic;
                    this.scoreValue = 100;
                } else if (type === 'fast') {
                    this.hp = 1;
                    this.speed = CONFIG.enemyBaseSpeed * 2.5;
                    this.radius = 10;
                    this.color = CONFIG.colors.enemyFast;
                    this.scoreValue = 200;
                } else if (type === 'tank') {
                    this.hp = 8;
                    this.speed = CONFIG.enemyBaseSpeed * 0.6;
                    this.radius = 25;
                    this.color = CONFIG.colors.enemyTank;
                    this.scoreValue = 500;
                }
            }

            update(playerPos) {
                // Move towards player
                const dir = playerPos.sub(this.pos).normalize();
                this.pos = this.pos.add(dir.mult(this.speed));
                
                // Rotate towards player for visual effect
                this.angle = Math.atan2(dir.y, dir.x);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                ctx.rotate(this.angle);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';

                ctx.beginPath();
                if (this.type === 'basic') {
                    // Square rotated
                    ctx.rect(-this.radius, -this.radius, this.radius*2, this.radius*2);
                } else if (this.type === 'fast') {
                    // Triangle
                    ctx.moveTo(this.radius, 0);
                    ctx.lineTo(-this.radius, -this.radius/1.5);
                    ctx.lineTo(-this.radius, this.radius/1.5);
                    ctx.closePath();
                } else if (this.type === 'tank') {
                    // Hexagon
                    for (let i = 0; i < 6; i++) {
                        const angle = i * Math.PI / 3;
                        const x = Math.cos(angle) * this.radius;
                        const y = Math.sin(angle) * this.radius;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                }
                
                ctx.fill();
                ctx.stroke();

                // Inner core
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Player {
            constructor() {
                this.pos = new Vector(state.width / 2, state.height / 2);
                this.vel = new Vector(0, 0);
                this.radius = 15;
                this.angle = 0;
                this.hp = 100;
                this.maxHp = 100;
                this.cooldown = 0;
            }

            update() {
                // Movement
                let input = new Vector(0, 0);
                if (keys['KeyW'] || keys['ArrowUp']) input.y -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) input.y += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) input.x -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) input.x += 1;

                if (input.mag() > 0) {
                    input = input.normalize().mult(CONFIG.playerSpeed);
                    this.vel = this.vel.add(input.mult(0.2)); // Acceleration
                }

                // Friction
                this.vel = this.vel.mult(CONFIG.playerDrag);
                this.pos = this.pos.add(this.vel);

                // Boundaries
                this.pos.x = Math.max(this.radius, Math.min(state.width - this.radius, this.pos.x));
                this.pos.y = Math.max(this.radius, Math.min(state.height - this.radius, this.pos.y));

                // Rotation
                this.angle = Math.atan2(state.mouseY - this.pos.y, state.mouseX - this.pos.x);

                // Shooting
                if (this.cooldown > 0) this.cooldown--;
                if ((keys['Space'] || (mouseDown)) && this.cooldown <= 0) {
                    this.shoot();
                }
            }

            shoot() {
                bullets.push(new Bullet(
                    this.pos.x + Math.cos(this.angle) * 20,
                    this.pos.y + Math.sin(this.angle) * 20,
                    state.mouseX,
                    state.mouseY
                ));
                this.cooldown = CONFIG.fireRate;
                
                // Recoil
                const recoil = new Vector(Math.cos(this.angle), Math.sin(this.angle)).mult(-2);
                this.vel = this.vel.add(recoil);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                ctx.rotate(this.angle);

                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = CONFIG.colors.player;

                // Ship Body
                ctx.fillStyle = '#000';
                ctx.strokeStyle = CONFIG.colors.player;
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.moveTo(20, 0); // Nose
                ctx.lineTo(-15, 15); // Back Left
                ctx.lineTo(-5, 0); // Engine indent
                ctx.lineTo(-15, -15); // Back Right
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Engine flame
                if (this.vel.mag() > 0.5) {
                    ctx.fillStyle = '#06b6d4';
                    ctx.beginPath();
                    ctx.moveTo(-8, 0);
                    ctx.lineTo(-25 - Math.random()*10, 0);
                    ctx.lineTo(-8, 5);
                    ctx.lineTo(-8, -5);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // --- Game Variables ---
        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let mouseDown = false;
        let animationId;

        // --- Core Functions ---

        function initGame() {
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            state.score = 0;
            state.wave = 1;
            state.frames = 0;
            state.isPlaying = true;
            
            updateHUD();
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            
            loop();
        }

        function spawnEnemy() {
            // Difficulty scaling
            const spawnRate = Math.max(20, 60 - (state.wave * 2)); 
            
            if (state.frames % spawnRate === 0) {
                const rand = Math.random();
                let type = 'basic';
                
                if (state.wave > 2 && rand > 0.8) type = 'fast';
                if (state.wave > 4 && rand > 0.95) type = 'tank';
                
                enemies.push(new Enemy(type));
            }
        }

        function createExplosion(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 5, 3));
            }
        }

        function checkCollisions() {
            // Bullets vs Enemies
            bullets.forEach(bullet => {
                enemies.forEach(enemy => {
                    if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                        const dist = bullet.pos.sub(enemy.pos).mag();
                        if (dist < enemy.radius + bullet.radius) {
                            bullet.markedForDeletion = true;
                            enemy.hp--;
                            createExplosion(bullet.pos.x, bullet.pos.y, '#fff', 3);
                            
                            if (enemy.hp <= 0) {
                                enemy.markedForDeletion = true;
                                state.score += enemy.scoreValue;
                                createExplosion(enemy.pos.x, enemy.pos.y, enemy.color, 15);
                                
                                // Wave progression
                                if (state.score > state.wave * 1000) {
                                    state.wave++;
                                    // Heal player slightly on wave clear
                                    player.hp = Math.min(player.maxHp, player.hp + 20);
                                }
                            }
                        }
                    }
                });
            });

            // Enemies vs Player
            enemies.forEach(enemy => {
                if (!enemy.markedForDeletion) {
                    const dist = enemy.pos.sub(player.pos).mag();
                    if (dist < enemy.radius + player.radius) {
                        enemy.markedForDeletion = true;
                        player.hp -= 20;
                        createExplosion(player.pos.x, player.pos.y, '#ff0000', 20);
                        
                        // Screen shake effect (simulated by offsetting canvas briefly? 
                        // Simpler: just flash red)
                        document.body.style.backgroundColor = '#300';
                        setTimeout(() => document.body.style.backgroundColor = '#050505', 50);

                        if (player.hp <= 0) {
                            endGame();
                        }
                    }
                }
            });
        }

        function updateHUD() {
            scoreDisplay.innerText = state.score.toLocaleString();
            waveDisplay.innerText = state.wave;
            const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            healthFill.style.width = `${hpPercent}%`;
        }

        function endGame() {
            state.isPlaying = false;
            cancelAnimationFrame(animationId);
            finalScoreDisplay.innerText = state.score.toLocaleString();
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.1)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            
            // Moving grid effect
            const offset = (state.frames * 0.5) % gridSize;

            ctx.beginPath();
            for (let x = 0; x <= state.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, state.height);
            }
            for (let y = offset; y <= state.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(state.width, y);
            }
            ctx.stroke();
        }

        function loop() {
            if (!state.isPlaying) return;

            // Clear
            ctx.fillStyle = 'rgba(5, 5, 5, 0.4)'; // Trails effect
            ctx.fillRect(0, 0, state.width, state.height);

            state.frames++;

            // Background Grid
            drawGrid();

            // Update & Draw Player
            player.update();
            player.draw(ctx);

            // Spawner
            spawnEnemy();

            // Update & Draw Bullets
            bullets = bullets.filter(b => !b.markedForDeletion);
            bullets.forEach(b => {
                b.update();
                b.draw(ctx);
            });

            // Update & Draw Enemies
            enemies = enemies.filter(e => !e.markedForDeletion);
            enemies.forEach(e => {
                e.update(player.pos);
                e.draw(ctx);
            });

            // Update & Draw Particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            checkCollisions();
            updateHUD();

            animationId = requestAnimationFrame(loop);
        }

        // --- Event Listeners ---
        document.getElementById('startBtn').addEventListener('click', initGame);
        document.getElementById('restartBtn').addEventListener('click', initGame);
        
        window.addEventListener('mousedown', () => mouseDown = true);
        window.addEventListener('mouseup', () => mouseDown = false);

        // Initial Render
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();

    </script>
</body>
</html>
