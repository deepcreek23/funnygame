<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Core Clicker</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --text-color: #e0e0e0;
            --accent: #00ffcc;
            --secondary: #ff0055;
            --panel-bg: #1a1a2e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
        }

        /* Left Panel: The Core */
        .game-area {
            background: var(--panel-bg);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 { margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
        
        .score-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px var(--accent);
        }

        .stats {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        #core-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            border: 4px solid var(--accent);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            z-index: 10;
            outline: none;
        }

        #core-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px var(--accent);
        }

        #core-btn:hover {
            box-shadow: 0 0 50px var(--accent);
        }

        /* Right Panel: Upgrades */
        .upgrade-area {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .upgrade-header {
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
            color: var(--secondary);
        }

        .upgrade-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(-5px);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .item-info h4 { margin: 0; font-size: 1rem; }
        .item-info p { margin: 5px 0 0; font-size: 0.8rem; color: #aaa; }
        .item-cost { font-weight: bold; color: var(--accent); }

        /* Floating Text Animation */
        .floating-text {
            position: absolute;
            color: white;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: 95vh; }
            #core-btn { width: 150px; height: 150px; }
        }
        
        .controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        
        button.reset-btn {
            background: transparent;
            border: 1px solid #555;
            color: #555;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Game Area -->
    <div class="game-area">
        <h1>Neon Core</h1>
        <div class="score-display"><span id="energy">0</span> Energy</div>
        <div class="stats">
            Per Click: <span id="per-click">1</span> | Per Second: <span id="per-second">0</span>
        </div>
        
        <button id="core-btn"></button>
        
        <div class="controls">
            <button class="reset-btn" onclick="resetGame()">Reset Save</button>
        </div>
    </div>

    <!-- Upgrade Shop -->
    <div class="upgrade-area">
        <div class="upgrade-header">
            <h3>System Upgrades</h3>
        </div>
        <div id="upgrades-list">
            <!-- Upgrades injected via JS -->
        </div>
    </div>
</div>

<script>
    // --- Game Configuration & State ---
    const GAME_CONFIG = {
        fps: 30,
        autoSaveInterval: 5000 // 5 seconds
    };

    let gameState = {
        energy: 0,
        totalClicks: 0,
        startTime: Date.now(),
        upgrades: {
            clicker: { count: 0, baseCost: 15, costMult: 1.5, power: 1, name: "Overclock Mouse", desc: "+1 Energy per click" },
            battery: { count: 0, baseCost: 100, costMult: 1.4, power: 2, name: "Li-Ion Battery", desc: "+2 Energy / sec" },
            server: { count: 0, baseCost: 500, costMult: 1.3, power: 10, name: "Home Server", desc: "+10 Energy / sec" },
            farm:   { count: 0, baseCost: 2000, costMult: 1.3, power: 50, name: "Crypto Farm", desc: "+50 Energy / sec" },
            ai:     { count: 0, baseCost: 10000, costMult: 1.4, power: 200, name: "Sentient AI", desc: "+200 Energy / sec" }
        }
    };

    // --- DOM Elements ---
    const elEnergy = document.getElementById('energy');
    const elPerClick = document.getElementById('per-click');
    const elPerSecond = document.getElementById('per-second');
    const elCoreBtn = document.getElementById('core-btn');
    const elUpgradesList = document.getElementById('upgrades-list');

    // --- Core Logic ---

    function getClickPower() {
        return 1 + (gameState.upgrades.clicker.count * gameState.upgrades.clicker.power);
    }

    function getAutoProduction() {
        let prod = 0;
        // Skip 'clicker' as it's manual
        for (const key in gameState.upgrades) {
            if (key !== 'clicker') {
                prod += gameState.upgrades[key].count * gameState.upgrades[key].power;
            }
        }
        return prod;
    }

    function getUpgradeCost(key) {
        const u = gameState.upgrades[key];
        return Math.floor(u.baseCost * Math.pow(u.costMult, u.count));
    }

    function addEnergy(amount) {
        gameState.energy += amount;
        updateUI();
    }

    // --- Interaction ---

    elCoreBtn.addEventListener('mousedown', (e) => {
        const power = getClickPower();
        addEnergy(power);
        gameState.totalClicks++;
        createFloatingText(e.clientX, e.clientY, `+${power}`);
    });

    // Handle Touch for mobile
    elCoreBtn.addEventListener('touchstart', (e) => {
        e.preventDefault(); // prevent zoom
        const touch = e.touches[0];
        const power = getClickPower();
        addEnergy(power);
        gameState.totalClicks++;
        createFloatingText(touch.clientX, touch.clientY, `+${power}`);
    });

    function buyUpgrade(key) {
        const cost = getUpgradeCost(key);
        if (gameState.energy >= cost) {
            gameState.energy -= cost;
            gameState.upgrades[key].count++;
            renderUpgrades();
            updateUI();
            saveGame();
        }
    }

    // --- Visuals ---

    function createFloatingText(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function updateUI() {
        elEnergy.innerText = Math.floor(gameState.energy).toLocaleString();
        elPerClick.innerText = getClickPower().toLocaleString();
        elPerSecond.innerText = getAutoProduction().toLocaleString();
        
        // Check affordability for visual feedback
        checkAffordability();
    }

    function renderUpgrades() {
        elUpgradesList.innerHTML = '';
        for (const [key, data] of Object.entries(gameState.upgrades)) {
            const cost = getUpgradeCost(key);
            const div = document.createElement('div');
            div.className = 'upgrade-item';
            div.id = `upg-${key}`;
            div.onclick = () => buyUpgrade(key);
            
            div.innerHTML = `
                <div class="item-info">
                    <h4>${data.name} <small>(Lvl ${data.count})</small></h4>
                    <p>${data.desc}</p>
                </div>
                <div class="item-cost">${cost.toLocaleString()}</div>
            `;
            elUpgradesList.appendChild(div);
        }
        checkAffordability();
    }

    function checkAffordability() {
        for (const key in gameState.upgrades) {
            const cost = getUpgradeCost(key);
            const el = document.getElementById(`upg-${key}`);
            if (el) {
                if (gameState.energy >= cost) {
                    el.classList.remove('disabled');
                } else {
                    el.classList.add('disabled');
                }
            }
        }
    }

    // --- Game Loop & Persistence ---

    // Passive Income Loop
    setInterval(() => {
        const production = getAutoProduction();
        if (production > 0) {
            // Add 1/10th of production every 100ms for smoothness
            addEnergy(production / 10);
        }
    }, 100);

    // Auto Save
    setInterval(saveGame, GAME_CONFIG.autoSaveInterval);

    function saveGame() {
        localStorage.setItem('neonClickerSave', JSON.stringify(gameState));
    }

    function loadGame() {
        const saved = localStorage.getItem('neonClickerSave');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                // Merge save with default config to handle updates/new items
                gameState = { ...gameState, ...parsed, upgrades: { ...gameState.upgrades, ...parsed.upgrades } };
            } catch (e) {
                console.error("Save file corrupted");
            }
        }
        renderUpgrades();
        updateUI();
    }

    function resetGame() {
        if(confirm("Are you sure you want to wipe your save?")) {
            localStorage.removeItem('neonClickerSave');
            location.reload();
        }
    }

    // Initialize
    loadGame();

</script>
</body>
</html>
