<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Clicker: Net Edition</title>
    <!-- PeerJS for Serverless Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #0f3460; --text: #e94560; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; }
        
        /* Layout */
        .col { flex: 1; background: var(--panel); padding: 20px; border-radius: 10px; overflow-y: auto; border: 1px solid var(--accent); }
        h1, h2 { color: var(--text); text-align: center; margin-top: 0; }
        
        /* Buttons & Inputs */
        button { background: var(--accent); color: white; border: none; padding: 10px; width: 100%; margin-bottom: 5px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover { background: var(--text); }
        button:disabled { background: gray; cursor: not-allowed; }
        input { width: 90%; padding: 8px; margin-bottom: 10px; background: #000; color: white; border: 1px solid var(--text); }

        /* Game Elements */
        .resource-display { font-size: 2em; text-align: center; margin: 20px 0; }
        .sub-resource { text-align: center; color: #aaa; font-size: 0.9em; }
        .upgrade-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; margin-bottom: 5px; border-radius: 5px; }
        .chat-box { height: 200px; overflow-y: scroll; background: black; border: 1px solid #333; padding: 10px; margin-bottom: 10px; font-size: 0.8em; }
        .msg { margin-bottom: 4px; }
        .sys-msg { color: yellow; font-style: italic; }
        
        /* Rebirth Modal */
        #rebirth-section { border-top: 2px solid var(--text); padding-top: 20px; margin-top: 20px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- LEFT COLUMN: GAMEPLAY -->
    <div class="col">
        <h1>COSMIC CLICKER</h1>
        <div class="resource-display">
            <span id="energy">0</span> Energy
            <div class="sub-resource"><span id="eps">0</span> / sec</div>
        </div>
        
        <button onclick="clickEnergy()" style="height: 80px; font-size: 1.2em;">GENERATE ENERGY</button>

        <div id="rebirth-section">
            <h2>DIMENSIONAL REBIRTH</h2>
            <p>Reset run for Dark Matter (Multiplies production)</p>
            <p>Current Dark Matter: <span id="dm" style="color:#d4af37">0</span> (Multiplier: x<span id="mult">1</span>)</p>
            <p>Potential Gain: <span id="potential-dm">0</span></p>
            <button onclick="doRebirth()" style="background: #d4af37; color: black;">REBIRTH NOW</button>
        </div>
    </div>

    <!-- MIDDLE COLUMN: UPGRADES -->
    <div class="col">
        <h2>UPGRADES</h2>
        <div id="upgrades-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- RIGHT COLUMN: MULTIPLAYER -->
    <div class="col">
        <h2>NET LINK (Multiplayer)</h2>
        <div id="connection-panel">
            <input type="text" id="username" placeholder="Enter Username" value="Player1">
            <hr>
            <button onclick="hostGame()">HOST NEW GAME</button>
            <p style="text-align:center; font-size:0.8em;">- OR -</p>
            <input type="text" id="host-id-input" placeholder="Enter Host ID">
            <button onclick="joinGame()">JOIN GAME</button>
            <p id="my-peer-id" style="word-break: break-all; font-size: 0.8em; color: #888; text-align: center;"></p>
        </div>

        <div id="game-ui" class="hidden">
            <div class="chat-box" id="chat-box"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chat-input" placeholder="Say something..." style="margin:0;">
                <button onclick="sendChat()" style="width: 60px; margin:0;">Send</button>
            </div>
            <h3>Connected Players</h3>
            <ul id="player-list"></ul>
        </div>
    </div>

<script>
    // --- GAME STATE ---
    let game = {
        energy: 0,
        totalEnergy: 0, // Lifetime energy for this run
        darkMatter: 0,
        startTime: Date.now(),
        buildings: [
            { id: 0, name: "Auto-Clicker", cost: 15, rate: 0.5, count: 0 },
            { id: 1, name: "Solar Panel", cost: 100, rate: 5, count: 0 },
            { id: 2, name: "Fusion Cell", cost: 1100, rate: 32, count: 0 },
            { id: 3, name: "Dyson Sphere", cost: 12000, rate: 150, count: 0 }
        ]
    };

    // Load Save
    if(localStorage.getItem('cosmicSave')) {
        const saved = JSON.parse(localStorage.getItem('cosmicSave'));
        game.energy = saved.energy;
        game.darkMatter = saved.darkMatter;
        game.totalEnergy = saved.totalEnergy || 0;
        // Merge building counts carefully
        saved.buildings.forEach((b, i) => {
            if(game.buildings[i]) game.buildings[i].count = b.count;
        });
    }

    // --- CORE LOGIC ---
    
    function getMultiplier() {
        return 1 + (game.darkMatter * 0.5); // Each DM adds 50% boost
    }

    function getEPS() {
        let rawRate = game.buildings.reduce((acc, b) => acc + (b.count * b.rate), 0);
        return rawRate * getMultiplier();
    }

    function clickEnergy() {
        const clickVal = 1 * getMultiplier();
        addEnergy(clickVal);
    }

    function addEnergy(amount) {
        game.energy += amount;
        game.totalEnergy += amount;
        updateUI();
    }

    function buyBuilding(id) {
        const b = game.buildings[id];
        if (game.energy >= b.cost) {
            game.energy -= b.cost;
            b.count++;
            b.cost = Math.ceil(b.cost * 1.15); // Price scaling
            updateUI();
            broadcastState(); // Tell multiplayer peers
        }
    }

    function calculatePotentialDM() {
        // Formula: Cube root of (Total Energy / 1000)
        if (game.totalEnergy < 1000) return 0;
        return Math.floor(Math.cbrt(game.totalEnergy / 1000));
    }

    function doRebirth() {
        const gain = calculatePotentialDM();
        if (gain <= 0) return alert("Not enough energy to rebirth!");
        
        if(!confirm(`Reset now? You will gain ${gain} Dark Matter.`)) return;

        game.darkMatter += gain;
        game.energy = 0;
        game.totalEnergy = 0;
        game.buildings.forEach(b => {
            b.count = 0;
            // Reset costs roughly (optional, keeping simple here)
            if(b.id === 0) b.cost = 15;
            else b.cost = Math.ceil(b.cost / Math.pow(1.15, b.count)); // Rough reset logic
        });
        
        // Actually, simpler cost reset:
        game.buildings[0].cost = 15;
        game.buildings[1].cost = 100;
        game.buildings[2].cost = 1100;
        game.buildings[3].cost = 12000;

        saveGame();
        updateUI();
        broadcastState();
        logChat("SYSTEM", `Reborn! Gained ${gain} Dark Matter.`);
    }

    // --- UI UPDATES ---
    
    function initUI() {
        const list = document.getElementById('upgrades-list');
        list.innerHTML = '';
        game.buildings.forEach(b => {
            const div = document.createElement('div');
            div.className = 'upgrade-item';
            div.innerHTML = `
                <div>
                    <strong>${b.name}</strong><br>
                    <small>Rate: ${b.rate}/s | Owned: <span id="count-${b.id}">${b.count}</span></small>
                </div>
                <button onclick="buyBuilding(${b.id})" id="btn-buy-${b.id}">
                    Buy (${b.cost})
                </button>
            `;
            list.appendChild(div);
        });
    }

    function updateUI() {
        document.getElementById('energy').innerText = Math.floor(game.energy).toLocaleString();
        document.getElementById('eps').innerText = getEPS().toFixed(1);
        document.getElementById('dm').innerText = game.darkMatter;
        document.getElementById('mult').innerText = getMultiplier().toFixed(1);
        
        const potential = calculatePotentialDM();
        document.getElementById('potential-dm').innerText = potential;

        game.buildings.forEach(b => {
            document.getElementById(`count-${b.id}`).innerText = b.count;
            const btn = document.getElementById(`btn-buy-${b.id}`);
            btn.innerText = `Buy (${b.cost.toLocaleString()})`;
            btn.disabled = game.energy < b.cost;
        });
    }

    function saveGame() {
        localStorage.setItem('cosmicSave', JSON.stringify(game));
    }

    setInterval(() => {
        const eps = getEPS();
        if(eps > 0) {
            addEnergy(eps / 10); // Run 10 times a second for smoothness
        }
        saveGame();
    }, 100);

    initUI();
    updateUI();

    // --- MULTIPLAYER (PEERJS) ---
    
    let peer = null;
    let conn = null; // For client
    let connections = []; // For host
    let myId = null;
    let username = "Anon";

    function initPeer() {
        username = document.getElementById('username').value || "Player";
        // Create a random ID for the peer
        peer = new Peer(null, {
            debug: 2
        });

        peer.on('open', (id) => {
            myId = id;
            document.getElementById('my-peer-id').innerText = "Your ID: " + id;
        });

        // If someone connects to us (We are Host)
        peer.on('connection', (c) => {
            setupConnection(c);
        });
    }

    function setupConnection(c) {
        c.on('open', () => {
            if(peer && connections.length === 0 && c.peer !== peer.id) { 
                // Logic check to ensure we treat incoming as client
            }
            
            // Add to list
            const isHost = connections.length === 0 && c.peer !== myId; 
            
            // Send handshake
            c.send({
                type: 'handshake',
                user: username,
                state: game
            });

            c.on('data', (data) => handleData(data, c));
            
            // Keep track
            if (!connections.includes(c)) connections.push(c);
            updatePlayerList();
            logChat("SYSTEM", `${data.user || 'Someone'} connected.`);
        });
        
        c.on('close', () => {
             logChat("SYSTEM", "A player disconnected.");
             connections = connections.filter(con => con !== c);
             updatePlayerList();
        });
    }

    function hostGame() {
        username = document.getElementById('username').value;
        if(!peer) initPeer();
        
        setTimeout(() => {
            alert("Hosting... Share your ID below with friends:\n" + myId);
            document.getElementById('connection-panel').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            logChat("SYSTEM", "You are the HOST. Waiting for players...");
        }, 1000);
    }

    function joinGame() {
        username = document.getElementById('username').value;
        const hostId = document.getElementById('host-id-input').value;
        if(!hostId) return alert("Enter Host ID");
        
        if(!peer) initPeer();

        setTimeout(() => {
            conn = peer.connect(hostId);
            conn.on('open', () => {
                document.getElementById('connection-panel').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                
                // Send our info
                conn.send({
                    type: 'handshake',
                    user: username,
                    state: game
                });
                logChat("SYSTEM", "Connected to Host!");
            });
            
            conn.on('data', (data) => handleData(data, null));
            conn.on('close', () => {
                alert("Lost connection to host");
                location.reload();
            });
        }, 1000);
    }

    function handleData(data, senderConn) {
        if (data.type === 'chat') {
            logChat(data.user, data.msg);
            // If I am host, relay to everyone else
            if (connections.length > 0 && senderConn) {
                connections.forEach(c => {
                    if(c !== senderConn) c.send(data);
                });
            }
        }
        else if (data.type === 'state-update') {
            // Update other player's visual stats (simplified)
            // In a full game, you'd sync specific player objects
            console.log("Received state from", data.user);
        }
        else if (data.type === 'handshake') {
            logChat("SYSTEM", `${data.user} joined the universe.`);
            // If I am host, send them current chat history or welcome msg
            if(connections.length > 0) {
                 senderConn.send({type:'chat', user:'SYSTEM', msg:'Welcome to the lobby!'});
            }
        }
    }

    function broadcastState() {
        const payload = {
            type: 'state-update',
            user: username,
            state: { energy: game.energy, dm: game.darkMatter } // Only send essentials
        };

        if (conn) {
            // I am client
            conn.send(payload);
        } else if (connections.length > 0) {
            // I am host
            connections.forEach(c => c.send(payload));
        }
    }

    function sendChat() {
        const input = document.getElementById('chat-input');
        const msg = input.value;
        if(!msg) return;
        
        const packet = { type: 'chat', user: username, msg: msg };
        
        // Display locally
        logChat(username, msg);
        
        // Send
        if (conn) {
            conn.send(packet);
        } else if (connections.length > 0) {
            connections.forEach(c => c.send(packet));
        }
        
        input.value = '';
    }

    function logChat(user, msg) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'msg';
        if(user === 'SYSTEM') div.classList.add('sys-msg');
        div.innerHTML = `<strong>${user}:</strong> ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updatePlayerList() {
        const list = document.getElementById('player-list');
        list.innerHTML = `<li>${username} (You)</li>`;
        // In a real implementation, we'd track names of all connected peers
        list.innerHTML += `<li>Remote Player(s) Connected</li>`;
    }

    // Initialize Peer immediately on load to be ready
    initPeer();

</script>
</body>
</html>
